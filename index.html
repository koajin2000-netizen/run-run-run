<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보건쌤과 함께하는 건강 RUN RUN RUN</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f7ff;--card:#fff;--ink:#2b3a55;--sub:#6b7a99;--accent:#ff7a59;--grass:#8fd46b;--track:#e9835f;--line:#d5e6f2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17233a;--card:#223350;--ink:#f1f5ff;--sub:#a6b4d3;--line:#33476b;--grass:#4f9a3d;--track:#b45a3c}}
:root[data-theme="dark"]{--bg:#17233a;--card:#223350;--ink:#f1f5ff;--sub:#a6b4d3;--line:#33476b;--grass:#4f9a3d;--track:#b45a3c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕','Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:18px;font-weight:500;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{text-align:center;font-size:30px;margin:8px 0 12px}
nav{display:flex;gap:8px;margin-bottom:14px}
nav button{flex:1;font:inherit;font-size:20px;padding:12px;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;cursor:pointer}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 4px 0 var(--line)}
.total{text-align:center;background:linear-gradient(135deg,#ffb36b,#ff7a59);color:#fff;box-shadow:0 4px 0 #d9583a}
.total .big{font-size:56px;line-height:1.1}.total .big small{font-size:26px}
.total .row{font-size:18px;opacity:.95}
.goal{margin-top:14px;background:rgba(255,255,255,.22);border-radius:16px;padding:10px 12px}
.goal .gt{font-size:18px}
.bar{position:relative;height:22px;background:rgba(255,255,255,.35);border-radius:12px;margin:8px 0 4px}
.bar i{position:absolute;left:0;top:0;bottom:0;min-width:10px;background:#fff;border-radius:12px;transition:width 1s}
.bar em{position:absolute;top:-6px;font-style:normal;font-size:26px;transform:translateX(-50%);transition:left 1s}
.goal .gp{font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:14px;background:rgba(255,255,255,.2);border-radius:12px;padding:3px 9px}
.chip.ok{background:#fff;color:#d9583a}
h2{margin:4px 0 10px;font-size:22px}
.lane{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:16px;cursor:pointer;margin-bottom:8px;background:var(--grass);position:relative}
.lane:active{transform:scale(.98)}
.medal{width:34px;text-align:center;font-size:26px;flex:none}
.track{flex:1;height:70px;background:var(--track);border-radius:12px;position:relative;overflow:hidden;border:2px dashed rgba(255,255,255,.6)}
.track .rn{position:absolute;bottom:2px;left:0;transition:left 1s}
.info{width:96px;flex:none;color:#fff;text-align:right;line-height:1.2;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.info b{font-size:20px;display:block;word-break:keep-all}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.kid{text-align:center;cursor:pointer;background:var(--bg);border-radius:18px;padding:8px 4px;border:2px solid var(--line)}
.kid:active{transform:scale(.95)}.kid .nm{font-size:17px;word-break:keep-all}.kid .km{font-size:14px;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:20px}
label{display:block;margin:12px 0 4px;font-size:19px}
input{width:100%;font:inherit;font-size:22px;padding:12px 14px;border:3px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
.go{width:100%;margin-top:18px;font:inherit;font-size:24px;padding:14px;border:0;border-radius:18px;background:var(--accent);color:#fff;box-shadow:0 5px 0 #d9583a;cursor:pointer}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #d9583a}
.msg{text-align:center;margin-top:14px;font-size:20px;min-height:28px}
.ov{position:fixed;inset:0;background:rgba(20,30,50,.6);display:none;align-items:flex-end;justify-content:center;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));position:relative}
.x{position:absolute;right:12px;top:10px;font:inherit;font-size:22px;border:0;background:var(--bg);color:var(--ink);width:40px;height:40px;border-radius:50%;cursor:pointer}
.hero{text-align:center}.hero .t{font-size:28px}
.stats{display:flex;gap:10px;margin:10px 0}.stats div{flex:1;background:var(--bg);border-radius:16px;padding:10px;text-align:center}
.stats b{display:block;font-size:30px;color:var(--accent)}
.day{display:flex;justify-content:space-between;align-items:center;padding:10px 6px;border-bottom:2px dotted var(--line)}
.day span:last-child{color:var(--accent)}
.del{font:inherit;font-size:14px;margin-left:6px;border:0;background:#ffd9d0;border-radius:8px;padding:2px 8px;cursor:pointer;color:#a33}
.set{font-size:15px;color:var(--sub);text-align:center}.set input{width:90px;font-size:16px;padding:4px 8px}
.rb{animation:bob .45s infinite ease-in-out}
.rb .l1{transform-origin:30px 46px;animation:l1 .45s infinite ease-in-out}
.rb .l2{transform-origin:30px 46px;animation:l2 .45s infinite ease-in-out}
.rb .a1{transform-origin:30px 33px;animation:l2 .45s infinite ease-in-out}
.rb .a2{transform-origin:30px 33px;animation:l1 .45s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes l1{0%,100%{transform:rotate(35deg)}50%{transform:rotate(-35deg)}}
@keyframes l2{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(35deg)}}
.goal .gt,.goal .gp,.total .row{font-weight:700}
.kid .nm,.info b,.day,.chip,label,.msg,.set,.stats div{font-weight:700}
.kid .km,.info{font-weight:500}
.kid .nm{font-size:16px}
h1,h2,nav button,.total .big,.stats b,.go,.hero .t,.x{font-family:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-weight:400}
.total{background:linear-gradient(135deg,#fff6ee,#ffe6d6);color:#5a3d33;box-shadow:0 4px 0 #f4d3bf}
.total .big{color:#f06a3e}
.goal{background:rgba(255,255,255,.75)}
.bar{background:#ffe3d4}
.bar i{background:linear-gradient(90deg,#ffc2a3,#ff9a76)}
.chip{background:#fff;color:#7a5a4c;border:1.5px solid #f4d3bf}
.chip.ok{background:#ff9a76;color:#fff;border-color:#ff9a76}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .total{background:linear-gradient(135deg,#4a3a4c,#3b3042);color:#ffe9dd;box-shadow:0 4px 0 #2b2233}:root:not([data-theme="light"]) .goal{background:rgba(255,255,255,.08)}:root:not([data-theme="light"]) .bar{background:rgba(255,255,255,.15)}:root:not([data-theme="light"]) .chip{background:rgba(255,255,255,.1);color:#ffe9dd;border-color:rgba(255,255,255,.2)}}
.kid{position:relative}
html{-webkit-text-size-adjust:100%}
button,.lane,.kid{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input[type=date]{min-height:54px;-webkit-appearance:none;appearance:none}
.sheet{max-height:88vh;max-height:88dvh;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.del{min-height:34px;padding:4px 12px}
.x{width:44px;height:44px}
.dr{display:inline-block;font-size:20px;margin-left:3px;animation:wob 1s infinite ease-in-out}
.dr.k{position:absolute;right:4px;top:30px;margin:0;font-size:26px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.gift{background:var(--bg);border-radius:16px;padding:12px;text-align:center;margin:10px 0;font-weight:700}
@keyframes wob{50%{transform:rotate(14deg) translateY(-2px)}}
@media (max-width:480px){
body{font-size:16px}
.wrap{padding:12px 12px calc(24px + env(safe-area-inset-bottom,0px))}
h1{font-size:25px;margin:4px 0 10px}
nav{gap:6px}nav button{font-size:18px;padding:11px 6px;border-radius:16px}
.card{padding:14px;border-radius:20px}
.total .big{font-size:46px}.total .big small{font-size:22px}
.total .row{font-size:16px}
.goal .gt{font-size:16px}
h2{font-size:20px}
.lane{gap:4px;padding:5px 6px}
.medal{width:26px;font-size:22px}
.track{height:60px}
.info{width:84px}.info b{font-size:17px}.info{font-size:14px}
.grid{grid-template-columns:repeat(3,1fr);gap:8px}
.kid .nm{font-size:15px}
.stats{gap:6px}.stats b{font-size:24px}.stats div{padding:8px 4px;font-size:15px}
.hero .t{font-size:24px}
.day{font-size:16px;flex-wrap:wrap;gap:4px}
input{font-size:20px}
.chip{font-size:13px}
}
.stat{font-size:14px;color:var(--sub);text-align:center;margin:4px 0 12px}
.stat button{font:inherit;font-size:14px;margin-left:6px;border:0;background:var(--card);color:var(--ink);border-radius:10px;padding:4px 10px;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.err{background:#ffe3df;color:#8a2a1c;border-radius:16px;padding:12px;text-align:center;margin-bottom:12px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏃 보건쌤과 함께하는<br>건강 RUN RUN RUN 🏅</h1>
  <div class="stat"><span id="upd">불러오는 중…</span><button id="rf">🔄 새로고침</button></div>
  <div class="err" id="err" style="display:none"></div>

  <section>
    <div class="card total">
      <div>우리가 함께 달린 거리</div>
      <div class="big"><span id="tkm">0</span><small> km</small></div>
      <div class="row"><span id="tlaps">0</span>바퀴 · <span id="tppl">0</span>명이 달렸어요!</div>
      <div class="goal">
        <div class="gt">🌍 목표: 지구 한 바퀴 <b>40,075 km</b></div>
        <div class="bar"><i id="gbar" style="width:0"></i><em id="gem" style="left:0">🏃</em></div>
        <div class="gp" id="gtxt"></div></div><div class="goal" style="margin-top:10px"><div class="gt" id="nxt"></div><div class="bar"><i id="nbar" style="width:0"></i><em id="nem" style="left:0">🏃</em></div><div class="gp" id="ntxt"></div><div class="chips" id="chips"></div>
      </div>
    </div>
    <div class="card"><h2>🏆 TOP 5</h2><div id="top"></div></div>
    <div class="card"><h2>🧒 모든 친구들 <small style="font-size:14px;color:var(--sub)">(눌러서 기록 보기)</small><div style="font-size:15px;color:var(--sub);margin-top:2px">🥤 50바퀴마다 음료수 선물! 음료수 표시가 있으면 보건쌤께 받으러 가요.</div></h2><div class="grid" id="all"></div></div>
  </section>
</div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
/* ===== 설정: 구글 시트 "웹에 게시" CSV 주소를 여기에 붙여 넣으세요 (README.md 참고) ===== */
const SHEET_URLS={
  runs:'https://docs.google.com/spreadsheets/d/e/2PACX-1vR9XH8LnI9X0lOVPeuzWKwoYAmRFpsi71xHU7UjIlgfiqP2zspFLqw_VX0t2zZNNGobWD4xegV4zkfq/pub?gid=1049413586&single=true&output=csv',    // 필수 — "기록" 탭 (이름, 바퀴수, 날짜)
  gifts:'https://docs.google.com/spreadsheets/d/e/2PACX-1vR9XH8LnI9X0lOVPeuzWKwoYAmRFpsi71xHU7UjIlgfiqP2zspFLqw_VX0t2zZNNGobWD4xegV4zkfq/pub?gid=1997653041&single=true&output=csv',   // 선택 — "음료수" 탭 (이름)
  config:'https://docs.google.com/spreadsheets/d/e/2PACX-1vR9XH8LnI9X0lOVPeuzWKwoYAmRFpsi71xHU7UjIlgfiqP2zspFLqw_VX0t2zZNNGobWD4xegV4zkfq/pub?gid=94412681&single=true&output=csv'   // 선택 — "설정" 탭 (한 바퀴 길이 m)
};
/* ========================================================================== */
const COLORS=['#ff6b6b','#4dabf7','#51cf66','#ffa94d','#cc5de8','#22b8cf','#f06595','#fcc419'];
const HAIR=['#3b2a20','#7a4a2a','#1f1f2e','#c9792b','#5b3a8c','#222'];
const SKIN=['#ffd9b8','#f7c59f','#ffe3c9'];
let LAP=200, runs=[], gifts=[];
const dr=(n,c='')=>n>0?`<span class="dr ${c}">🥤${n>1?'×'+n:''}</span>`:'';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
const km=l=>(l*LAP/1000);
const fmt=n=>(Math.round(n*100)/100).toLocaleString('ko-KR');
function dstr(s){if(!s)return '날짜 없음';const [y,m,d]=s.split('-').map(Number);const w='일월화수목금토'[new Date(y,m-1,d).getDay()];return m+'월 '+d+'일 ('+w+')'}
const cleanName=s=>String(s||'').trim().replace(/\s+/g,' ');

function parseCSV(t){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==','){row.push(f);f=''}
    else if(c=='\n'){row.push(f);rows.push(row);row=[];f=''}
    else if(c!='\r')f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function normDate(s){
  s=String(s||'').trim();let m;
  if(m=s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/))return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))return m[3]+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');
  return '';
}
async function load(url){
  const r=await fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return parseCSV(await r.text()).slice(1);
}

function runner(name,size){
  const h=hash(name),c=COLORS[h%8],hair=HAIR[(h>>3)%6],skin=SKIN[(h>>5)%3],girl=(h>>7)%2;
  return `<svg class="rb" width="${size}" height="${size*1.15}" viewBox="0 0 60 70" aria-hidden="true">
  <ellipse cx="30" cy="67" rx="14" ry="2.5" fill="rgba(0,0,0,.18)"/>
  <line class="l1" x1="30" y1="46" x2="30" y2="62" stroke="${skin}" stroke-width="5" stroke-linecap="round"/>
  <line class="l2" x1="30" y1="46" x2="30" y2="62" stroke="${skin}" stroke-width="5" stroke-linecap="round" opacity=".85"/>
  <line class="a1" x1="30" y1="33" x2="30" y2="45" stroke="${skin}" stroke-width="4" stroke-linecap="round"/>
  <line class="a2" x1="30" y1="33" x2="30" y2="45" stroke="${skin}" stroke-width="4" stroke-linecap="round" opacity=".85"/>
  <rect x="21" y="30" width="18" height="18" rx="7" fill="${c}"/>
  <circle cx="30" cy="19" r="12" fill="${skin}"/>
  <path d="M18 18a12 12 0 0 1 24 0q-6-6-12-4t-12 4z" fill="${hair}"/>
  ${girl?`<circle cx="42" cy="14" r="4" fill="${hair}"/><circle cx="42" cy="14" r="1.6" fill="${c}"/>`:''}
  <circle cx="26" cy="21" r="1.7" fill="#222"/><circle cx="34" cy="21" r="1.7" fill="#222"/>
  <circle cx="23.5" cy="25" r="2" fill="#ff9a9a" opacity=".6"/><circle cx="36.5" cy="25" r="2" fill="#ff9a9a" opacity=".6"/>
  <path d="M27 25q3 3 6 0" stroke="#c0392b" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`;
}

function agg(){
  const m={};
  for(const r of runs){const k=r.name;(m[k]=m[k]||{name:k,laps:0,days:{}});m[k].laps+=r.laps;m[k].days[r.date]=(m[k].days[r.date]||0)+r.laps}
  const L=Object.values(m);
  for(const x of L){x.earned=Math.floor(x.laps/50);x.given=gifts.filter(g=>g===x.name).length;x.pend=Math.max(0,x.earned-x.given)}
  return L.sort((a,b)=>b.laps-a.laps||a.name.localeCompare(b.name,'ko'));
}

function render(){
  const list=agg(), tl=list.reduce((s,x)=>s+x.laps,0);
  $('tkm').textContent=fmt(km(tl));$('tlaps').textContent=tl;$('tppl').textContent=list.length;
  const EARTH=40075,tk=km(tl),pc=Math.min(100,tk/EARTH*100);
  $('gbar').style.width=pc+'%';$('gem').style.left=Math.max(3,Math.min(97,pc))+'%';
  const MS=[[42.195,'🏅 마라톤 풀코스'],[160,'서울 → 대전'],[400,'서울 → 부산'],[950,'서울 → 베이징'],[1160,'서울 → 도쿄'],[11000,'서울 → 뉴욕']];
  const nx=MS.find(m=>tk<m[0]),pv=nx?(MS[MS.indexOf(nx)-1]||[0])[0]:0,np=nx?Math.max(0,(tk-pv)/(nx[0]-pv)*100):100;
  $('nbar').style.width=np+'%';$('nem').style.left=Math.max(3,Math.min(97,np))+'%';
  $('nxt').innerHTML=nx?'🚩 다음 목표: <b>'+nx[1]+'</b> (약 '+nx[0]+' km)':'🚩 모든 중간 목표를 달성했어요!';
  $('ntxt').textContent=nx?'남은 거리 '+fmt(nx[0]-tk)+' km':'';
  $('chips').innerHTML=MS.map(m=>'<span class="chip'+(tk>=m[0]?' ok':'')+'">'+(tk>=m[0]?'✅ ':'🔒 ')+m[1]+'</span>').join('');
  $('gtxt').textContent=tk>=EARTH?'🎉 와! 지구 한 바퀴를 다 달렸어요!':'지구 한 바퀴까지 '+fmt(EARTH-tk)+' km 남았어요 ('+(pc<0.1&&tk>0?'0.1% 미만':pc.toFixed(1)+'%')+')';
  const max=Math.max(1,list[0]?.laps||1), med=['🥇','🥈','🥉','4','5'];
  $('top').innerHTML=list.length?list.slice(0,5).map((x,i)=>`<div class="lane" data-n="${esc(x.name)}">
    <div class="medal">${med[i]}</div>
    <div class="track"><div class="rn" style="left:calc(${(x.laps/max*100).toFixed(1)}% - ${(x.laps/max*52).toFixed(0)}px)">${runner(x.name,52)}</div></div>
    <div class="info"><b>${esc(x.name)}${dr(x.pend)}</b>${fmt(km(x.laps))} km</div></div>`).join(''):'<div class="empty">아직 기록이 없어요.<br>첫 번째 달리기 주인공이 되어 보세요! 🌟</div>';
  $('all').innerHTML=list.map(x=>`<div class="kid" data-n="${esc(x.name)}">${dr(x.pend,'k')}${runner(x.name,56)}<div class="nm">${esc(x.name)}</div><div class="km">${fmt(km(x.laps))} km</div></div>`).join('');
  if($('ov').classList.contains('on')&&cur)openKid(cur);
}

let cur=null;
function openKid(name){
  cur=name;const list=agg(),i=list.findIndex(x=>x.name===name);
  if(i<0){closeKid();return}
  const x=list[i], days=Object.keys(x.days).sort().reverse();
  $('sheet').innerHTML=`<button class="x" id="cx">✕</button>
  <div class="hero">${runner(name,96)}<div class="t">${esc(name)}</div><div>현재 <b style="color:var(--accent)">${i+1}등</b> 🎉</div></div>
  <div class="stats"><div><b>${x.laps}</b>바퀴</div><div><b>${fmt(km(x.laps))}</b>km</div><div><b>${days.length}</b>일 달림</div></div>
  <div class="gift">${x.pend>0?`🥤 음료수 <b style="color:var(--accent)">${x.pend}개</b>를 받을 수 있어요!<br>보건쌤께 가 보세요~`:`🥤 다음 음료수까지 <b style="color:var(--accent)">${50-x.laps%50}바퀴</b> 남았어요!`}${x.given>0?`<div style="font-size:14px;color:var(--sub)">지금까지 받은 음료수 ${x.given}개</div>`:''}</div>
  <h2>📅 날짜별 기록</h2>
  ${days.map(d=>`<div class="day"><span>${dstr(d)}</span><span>${x.days[d]}바퀴 · ${fmt(km(x.days[d]))}km</span></div>`).join('')}`;
  $('ov').classList.add('on');
  $('cx').onclick=closeKid;
}
function closeKid(){cur=null;$('ov').classList.remove('on')}
$('ov').onclick=e=>{if(e.target.id==='ov')closeKid()};
document.addEventListener('click',e=>{const k=e.target.closest('[data-n]');if(k)openKid(k.dataset.n)});

let busy=false;
async function refresh(){
  if(busy)return;
  const err=$('err');
  if(!SHEET_URLS.runs){err.style.display='';err.textContent='⚙️ 구글 시트 주소가 아직 연결되지 않았어요. (index.html 위쪽 SHEET_URLS 설정)';$('upd').textContent='';render();return}
  busy=true;$('rf').disabled=true;
  try{
    const r=await load(SHEET_URLS.runs);
    runs=r.map(c=>({name:cleanName(c[0]),laps:parseInt(String(c[1]).replace(/[^\d-]/g,''),10),date:normDate(c[2])})).filter(x=>x.name&&x.laps>0);
    if(SHEET_URLS.gifts){try{gifts=(await load(SHEET_URLS.gifts)).map(c=>cleanName(c[0])).filter(Boolean)}catch(e){}}
    if(SHEET_URLS.config){try{const c=await load(SHEET_URLS.config);const v=parseInt(String((c[0]||[])[0]).replace(/[^\d]/g,''),10);if(v>0)LAP=v}catch(e){}}
    err.style.display='none';
    const d=new Date();$('upd').textContent='마지막 확인 '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
    render();
  }catch(e){
    err.style.display='';err.textContent='😢 기록을 불러오지 못했어요. 잠시 후 새로고침 해 보세요.';
  }
  busy=false;$('rf').disabled=false;
}
$('rf').onclick=refresh;
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
setInterval(refresh,60000);
render();refresh();
</script>
</body>
</html>
